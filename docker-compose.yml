services:
  voice-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - voice-data:/app/data
      - model-cache:/root/.cache
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-this-admin-token}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
    gpus: all
    restart: unless-stopped

volumes:
  voice-data:
  model-cache:
